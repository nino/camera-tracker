[package]
name = "solver"
version = "0.1.0"
edition = "2021"
description = "Camera solver for camera-tracker: bundle adjustment from 2D tracks"
publish = false

[lib]
# rlib for tests and native use; cdylib for the WebAssembly build.
crate-type = ["rlib", "cdylib"]

[dependencies]
nalgebra = "0.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.test]
opt-level = 2
